name: Validate Space prototype
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/property_index.py
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/catalog.test.mjs
      - run: node --test tests/hq1-venue.test.mjs
      - run: node --check hq1/hq1.mjs
      - run: node --check space/app.js
      - run: node --check space/viewer.js
