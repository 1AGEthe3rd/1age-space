name: Validate World schedules
on:
  pull_request:
    paths:
      - 'world/gameplay/schedule*.mjs'
      - 'world/gameplay/rail-stations.mjs'
      - 'world/gameplay/arrival-board.mjs'
      - 'world/schedule-service/**'
      - '.github/workflows/validate-world-schedules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schedules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test world/gameplay/schedules.test.mjs world/schedule-service/providers.test.mjs
