name: Validate World release
on:
  pull_request:
    branches: [main]
    paths:
      - 'hq1/**'
      - 'hq2/**'
      - 'world/**'
      - 'tests/**'
      - 'scripts/world-release-smoke.mjs'
      - '.github/workflows/validate-world-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs hq1/portland/*.test.mjs hq2/*.test.mjs world/gameplay/*.test.mjs world/schedule-service/*.test.mjs
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/world-smoke" --no-save playwright@1.56.1
          "$RUNNER_TEMP/world-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run local browser smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/world-http.log" 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8765/hq1/ >/dev/null && break; sleep 1; done
          export PLAYWRIGHT_ROOT="$RUNNER_TEMP/world-smoke"
          node scripts/world-release-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-release-screenshots
          path: world-release-screenshots/
          if-no-files-found: warn
